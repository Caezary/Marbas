name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '_documentation/**'
      - '.gitignore'
      - '.idea/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '_documentation/**'
      - '.gitignore'
      - '.idea/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet fantomas --check Marbas Marbas.Tests

  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Marbas.slnx

      - name: Run the analyzers
        run: dotnet msbuild Marbas.slnx -t:AnalyzeFSharpProject

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Marbas.slnx

      - name: Build
        run: dotnet build Marbas.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Marbas.slnx
          --configuration Release
          --no-build
          --settings coverlet.runsettings
          --logger "trx;LogFileName=marbas.trx"
          --results-directory artifacts/tests

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/tests
