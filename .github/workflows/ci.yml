name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '_documentation/**'
      - '.gitignore'
      - '.idea/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '_documentation/**'
      - '.gitignore'
      - '.idea/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Marbas.slnx

      - name: Build
        run: dotnet build Marbas.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Marbas.slnx
          --configuration Release
          --no-build
          --settings coverlet.runsettings
          --logger "trx;LogFileName=marbas.trx"
          --results-directory artifacts/tests

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/tests
