name: Feature request
description: Something Marbas could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and where Marbas gets in the way of it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What Marbas could do
      description: The behaviour you have in mind, with keys and dialogs where it matters.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead now
      description: A workaround, or how another orthodox file manager handles it.
